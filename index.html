<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shot Docs" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LGA Shot Docs</title>
    <script>
      // El tema elegido se aplica antes de pintar, para que no aparezca un instante el otro.
      var dark = matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var p = (JSON.parse(localStorage.getItem('shotdocs-prefs')) || {}).prefs || {};
        if (p.theme === 'dark' || p.theme === 'light') dark = p.theme === 'dark';
      } catch (e) {}
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Sin JavaScript (algunos lectores automáticos): qué es la app y los links a privacidad y condiciones. -->
    <noscript>
      <p>LGA Shot Docs: VFX documentation, pre-production notes and on-set reports. It needs JavaScript.</p>
      <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
